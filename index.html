<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yedek Parça ERP - SPA</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* --- GENEL VE NAVBAR (Öncekiyle Aynı) --- */
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f8fafc; margin: 0; color: #334155; }
        .navbar { background-color: #0f172a; color: white; display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .nav-brand { font-size: 22px; font-weight: 700; color: #f8fafc; }
        .nav-brand span { color: #38bdf8; font-size: 14px; margin-left: 5px; }
        .nav-links { display: flex; gap: 10px; }
        .nav-links button { background: none; border: none; color: #94a3b8; font-size: 15px; font-weight: 500; padding: 10px 15px; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .nav-links button:hover { color: white; background-color: #1e293b; }
        .nav-links button.active { color: white; background-color: #0284c7; }

        /* --- SPA (SEKME) MANTIĞI --- */
        .page-section { display: none; padding: 30px; max-width: 1200px; margin: 0 auto; }
        .page-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- DASHBOARD İSTATİSTİK (Öncekiyle Aynı) --- */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-left: 5px solid #0ea5e9; display: flex; flex-direction: column; }
        .stat-card.warning { border-left-color: #ef4444; } 
        .stat-card.success { border-left-color: #10b981; } 
        .stat-title { font-size: 14px; color: #64748b; font-weight: 600; text-transform: uppercase; }
        .stat-value { font-size: 32px; font-weight: bold; color: #0f172a; margin-top: 10px; }

        /* --- GRAFİK ALANI --- */
        .chart-wrapper { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(202, 15, 15, 0.05); }
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #e6e8eb; padding-bottom: 15px; }
        .chart-container { height: 400px; width: 100%; }
        .ai-badge { background: #dcfce7; color: #166534; padding: 10px 15px; border-radius: 6px; font-weight: 600; display: none; margin-bottom: 15px; }
        select, input { padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; font-size: 14px; outline: none; }
        button.btn-primary { background: #0ea5e9; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
        button.btn-primary:hover { background: #0284c7; }
        button.btn-danger { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        button.btn-danger:hover { background: #dc2626; }

        /* --- CRUD EKRANLARI (YENİ) --- */
        .crud-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 30px; }
        .crud-form { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); height: fit-content; }
        .crud-form h3 { margin-top: 0; margin-bottom: 20px; color: #0f172a; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; color: #475569; }
        .form-group input, .form-group select { width: 100%; box-sizing: border-box; }
        
        .crud-table-wrapper { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .search-bar { width: 100%; margin-bottom: 15px; box-sizing: border-box; padding: 12px; font-size: 15px; border: 2px solid #e2e8f0; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background-color: #f8fafc; color: #475569; font-weight: 600; }
        tr:hover { background-color: #f1f5f9; }
    </style>
</head>
<body>

    <!-- 1. NAVBAR -->
    <nav class="navbar">
        <div class="nav-brand">Yedek Parça ERP <span>Yapay Zeka Destekli</span></div>
        <div class="nav-links">
            <button onclick="switchPage('dashboard')" id="nav-dashboard" class="active">Dashboard</button>
            <button onclick="switchPage('parts')" id="nav-parts">Parçalar</button>
            <button onclick="switchPage('suppliers')" id="nav-suppliers">Tedarikçiler</button>
            <button onclick="switchPage('movements')" id="nav-movements">Hareketler</button>
        </div>
    </nav>

    <!-- 2. DASHBOARD SEKMSİ -->
    <div id="page-dashboard" class="page-section active">
        <div class="stats-grid">
            <div class="stat-card"><span class="stat-title">Toplam Yedek Parça</span><span class="stat-value" id="stat-total-parts">0</span></div>
            <div class="stat-card success"><span class="stat-title">Aktif Tedarikçi</span><span class="stat-value" id="stat-total-suppliers">0</span></div>
            <div class="stat-card warning"><span class="stat-title">Kritik Stok (< 10 Adet)</span><span class="stat-value" id="stat-critical-stock">0</span></div>
        </div>
        <div class="chart-wrapper">
            <div class="controls">
                <select id="dashboardPartSelect" onchange="loadChartData()"><option value="" disabled selected>Grafik İçin Parça Seçin...</option></select>
                <div class="filters">
                    <button id="btn3" onclick="setChartFilter(3)">Son 3 Ay</button>
                    <button id="btn6" onclick="setChartFilter(6)">Son 6 Ay</button>
                    <button id="btnAll" class="active" onclick="setChartFilter(99)">Tümü</button>
                </div>
            </div>
            <div id="aiBadge" class="ai-badge">Hesaplanıyor...</div> 
            <div class="chart-container"><canvas id="salesChart"></canvas></div>
        </div>
    </div>

    <!-- 3. PARÇALAR SEKMSİ (CRUD) -->
    <div id="page-parts" class="page-section">
        <div class="crud-grid">
            <div class="crud-form">
                <h3 id="partFormTitle">Yeni Parça Ekle</h3>
                <form onsubmit="event.preventDefault(); savePart();">
                    <div class="form-group"><label>Parça Adı</label><input type="text" id="partName" required></div>
                    <div class="form-group"><label>Açıklama</label><input type="text" id="partDesc"></div>
                    <div class="form-group"><label>Fiyat (₺)</label><input type="number" step="0.01" id="partPrice" required></div>
                    <div class="form-group"><label>Stok Miktarı</label><input type="number" id="partStock" required></div>
                    <div class="form-group"><label>Tedarikçi</label><select id="partSupplierId" required><option value="">Seçiniz...</option></select></div>
                    
                    <button type="submit" id="partSubmitBtn" class="btn-primary">Kaydet</button>
                    <!-- Güncelleme modunda iptal edebilmek için gizli bir buton -->
                    <button type="button" id="partCancelBtn" class="btn-danger" style="display: none; width: 100%; margin-top: 10px;" onclick="cancelPartEdit()">İptal Et</button>
                </form>
            </div>
            <div class="crud-table-wrapper">
                <input type="text" class="search-bar" id="searchPart" onkeyup="filterParts()" placeholder="🔍 Parça adı veya ID'sine göre ara...">
                <table>
                    <thead><tr><th>ID</th><th>Parça Adı</th><th>Fiyat</th><th>Stok</th><th>Tedarikçi ID</th><th>İşlemler</th></tr></thead>
                    <tbody id="partsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
    <!-- 4. TEDARİKÇİLER SEKMSİ (CRUD) -->
    <div id="page-suppliers" class="page-section">
        <div class="crud-grid">
            <div class="crud-form">
                <h3>Yeni Tedarikçi Ekle</h3>
                <form onsubmit="event.preventDefault(); addSupplier();">
                    <div class="form-group"><label>Firma Adı</label><input type="text" id="supName" required></div>
                    <div class="form-group"><label>Email</label><input type="email" id="supEmail" required></div>
                    <div class="form-group"><label>Telefon</label><input type="text" id="supPhone" required></div>
                    <button type="submit" class="btn-primary">Kaydet</button>
                </form>
            </div>
            <div class="crud-table-wrapper">
                <table>
                    <thead><tr><th>ID</th><th>Firma Adı</th><th>Email</th><th>Telefon</th><th>İşlem</th></tr></thead>
                    <tbody id="suppliersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 5. HAREKETLER SEKMSİ (CRUD) -->
    <div id="page-movements" class="page-section">
        <div class="crud-grid">
            <div class="crud-form">
                <h3>Yeni Stok Hareketi</h3>
                <form onsubmit="event.preventDefault(); addMovement();">
                    <div class="form-group"><label>Yedek Parça</label><select id="movPartId" required><option value="">Seçiniz...</option></select></div>
                    <div class="form-group"><label>Hareket Tipi</label>
                        <select id="movType" required>
                            <option value="IN">GİRİŞ (IN - Alım)</option>
                            <option value="OUT">ÇIKIŞ (OUT - Satış)</option>
                        </select>
                    </div>
                    <div class="form-group"><label>Miktar</label><input type="number" id="movQuantity" min="1" required></div>
                    <div class="form-group"><label>Tarih</label><input type="datetime-local" id="movDate" required></div>
                    <button type="submit" class="btn-primary">Kaydet</button>
                </form>
            </div>
            <div class="crud-table-wrapper">
                <!-- YENİ EKLENEN: Arama Çubuğu -->
                <input type="text" class="search-bar" id="searchMovement" onkeyup="filterMovements()" placeholder="🔍 Parça ID, Tip (IN/OUT) veya Tarihe göre ara...">
                
                <table>
                    <thead><tr><th>ID</th><th>Parça ID</th><th>Tip</th><th>Miktar</th><th>Tarih</th><th>İşlem</th></tr></thead>
                    <tbody id="movementsTableBody"></tbody>
                </table>

                <!-- YENİ EKLENEN: Sayfalama (Pagination) Kontrolleri -->
                <div id="movementPagination" style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                    <button onclick="changeMovementPage(-1)" class="btn-primary" style="width: auto; padding: 6px 12px; background: #64748b;">⬅ Önceki</button>
                    <span id="movementPageInfo" style="font-weight: 600; font-size: 14px; color: #475569;">Sayfa 1 / 1</span>
                    <button onclick="changeMovementPage(1)" class="btn-primary" style="width: auto; padding: 6px 12px; background: #64748b;">Sonraki ➡</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT KODLARI -->
    <script>
        const API_URL = ""; 
        let allParts = []; // Arama filtresi için global değişken

        // --- BAŞLANGIÇ ---
        window.onload = async () => {
            // Şimdiki zamanı Hareketler formuna varsayılan olarak bas
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('movDate').value = now.toISOString().slice(0,16);
            
            await loadDashboardStats();
            await loadSuppliers();
            await loadParts();
        };

        // --- SEKME GEÇİŞİ (SPA) ---
        function switchPage(pageId) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-links button').forEach(el => el.classList.remove('active'));
            document.getElementById(`page-${pageId}`).classList.add('active');
            document.getElementById(`nav-${pageId}`).classList.add('active');

            if(pageId === 'parts') loadParts();
            if(pageId === 'suppliers') loadSuppliers();
            if(pageId === 'movements') loadMovements();
            if(pageId === 'dashboard') loadDashboardStats();
        }

        // --- DASHBOARD VE GRAFİK (Öncekiyle Aynı) ---
        let salesChart = null, currentChartFilter = 99, rawHistoryData = [], predictionData = {};
        async function loadDashboardStats() {
            try {
                const [pRes, sRes] = await Promise.all([fetch(`${API_URL}/parts/`), fetch(`${API_URL}/suppliers/`)]);
                const parts = await pRes.json(); const suppliers = await sRes.json();
                document.getElementById('stat-total-parts').innerText = parts.length;
                document.getElementById('stat-total-suppliers').innerText = suppliers.length;
                document.getElementById('stat-critical-stock').innerText = parts.filter(p => p.stock_quantity < 10).length;
                
                const select = document.getElementById('dashboardPartSelect');
                select.innerHTML = '<option value="" disabled selected>Grafik İçin Parça Seçin...</option>';
                parts.forEach(p => select.options.add(new Option(`#${p.id} ${p.name}`, p.id)));
                if(parts.length > 0) { select.value = parts[0].id; loadChartData(); }
            } catch (e) { console.error(e); }
        }
        function setChartFilter(m) { currentChartFilter = m; document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); renderChart(); }
        async function loadChartData() {
            const id = document.getElementById('dashboardPartSelect').value; if(!id) return;
            try {
                const [hRes, pRes] = await Promise.all([fetch(`${API_URL}/api/sales-history/${id}`), fetch(`${API_URL}/api/predict/${id}`)]);
                rawHistoryData = await hRes.json(); predictionData = await pRes.json();
                const badge = document.getElementById('aiBadge'); badge.style.display = 'inline-block';
                badge.innerHTML = `Gelecek Ay Tahmini (${predictionData.next_month}. Ay): <b>${predictionData.predicted_sales} Adet Satış</b>`;
                renderChart();
            } catch (e) { console.error(e); }
        }
        function renderChart() {
            let hist = currentChartFilter !== 99 ? rawHistoryData.slice(-currentChartFilter) : rawHistoryData;
            const labels = hist.map(i => `${i.year}-${i.month}`); labels.push(`Gelecek Ay`);
            const actual = hist.map(i => i.total_sales);
            const pred = Array(actual.length - 1).fill(null); pred.push(actual[actual.length - 1]); pred.push(predictionData.predicted_sales);
            if(salesChart) salesChart.destroy();
            salesChart = new Chart(document.getElementById('salesChart').getContext('2d'), {
                type: 'line', data: { labels, datasets: [
                    { label: 'Gerçekleşen', data: [...actual, null], borderColor: '#0ea5e9', backgroundColor: 'rgba(14, 165, 233, 0.1)', borderWidth: 3, fill: true, tension: 0.3 },
                    { label: 'AI Tahmini', data: pred, borderColor: '#10b981', borderWidth: 3, borderDash: [5, 5], pointBackgroundColor: '#10b981', fill: false, tension: 0.3 }
                ]}, options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // ==========================================
        // 1. TEDARİKÇİ (SUPPLIER) CRUD
        // ==========================================
        async function loadSuppliers() {
            const res = await fetch(`${API_URL}/suppliers/`);
            const data = await res.json();
            const tbody = document.getElementById('suppliersTableBody');
            const select = document.getElementById('partSupplierId'); // Parça ekleme formundaki dropdown
            tbody.innerHTML = ''; select.innerHTML = '<option value="">Seçiniz...</option>';
            
            data.forEach(s => {
                tbody.innerHTML += `<tr><td>#${s.id}</td><td>${s.name}</td><td>${s.contact_email}</td><td>${s.phone}</td>
                    <td><button class="btn-danger" onclick="deleteSupplier(${s.id})">Sil</button></td></tr>`;
                select.options.add(new Option(s.name, s.id));
            });
        }
        async function addSupplier() {
            const payload = {
                name: document.getElementById('supName').value,
                contact_email: document.getElementById('supEmail').value,
                phone: document.getElementById('supPhone').value
            };
            const res = await fetch(`${API_URL}/suppliers/`, {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
            });
            if(res.ok) { document.querySelector('#page-suppliers form').reset(); loadSuppliers(); loadDashboardStats(); }
            else { const err = await res.json(); alert(err.detail || 'Hata oluştu'); }
        }
        async function deleteSupplier(id) {
            if(!confirm('Bu tedarikçiyi silmek istediğinize emin misiniz?')) return;
            const res = await fetch(`${API_URL}/suppliers/${id}`, { method: 'DELETE' });
            if(res.ok) { loadSuppliers(); loadDashboardStats(); }
            else { alert('Hata: Büyük ihtimalle bu tedarikçiye ait parçalar var. Önce parçaları silin.'); }
        }

        // ==========================================
        // 2. PARÇA (PART) CRUD, ARAMA VE GÜNCELLEME
        // ==========================================
        let editingPartId = null; // Hangi parçayı düzenlediğimizi aklında tutacak değişken

        async function loadParts() {
            const res = await fetch(`${API_URL}/parts/`);
            allParts = await res.json();
            renderPartsTable(allParts);
            
            const select = document.getElementById('movPartId');
            if (select) {
                select.innerHTML = '<option value="">Seçiniz...</option>';
                allParts.forEach(p => select.options.add(new Option(`#${p.id} ${p.name}`, p.id)));
            }
        }

        function renderPartsTable(data) {
            const tbody = document.getElementById('partsTableBody');
            tbody.innerHTML = '';
            data.forEach(p => {
                const stockColor = p.stock_quantity < 10 ? 'color: red; font-weight: bold;' : '';
                tbody.innerHTML += `<tr>
                    <td>#${p.id}</td>
                    <td>${p.name}</td>
                    <td>${p.price} ₺</td>
                    <td style="${stockColor}">${p.stock_quantity}</td>
                    <td>#${p.supplier_id}</td>
                    <td>
                        <button class="btn-primary" style="padding: 4px 8px; font-size: 12px; margin-right: 5px;" onclick="editPart(${p.id})">Düzenle</button>
                        <button class="btn-danger" style="padding: 4px 8px;" onclick="deletePart(${p.id})">Sil</button>
                    </td>
                </tr>`;
            });
        }

        function filterParts() {
            const text = document.getElementById('searchPart').value.toLowerCase().trim();
            const filtered = allParts.filter(p => 
                p.name.toLowerCase().includes(text) || p.id.toString() === text
            );
            renderPartsTable(filtered);
        }

        // --- YENİ EKLENEN: Formu Düzenleme Moduna Sokma ---
        function editPart(id) {
            // Düzenlenecek parçayı hafızadaki (allParts) listeden bul
            const part = allParts.find(p => p.id === id);
            if(!part) return;

            // Formun içini parçanın mevcut bilgileriyle doldur
            document.getElementById('partName').value = part.name;
            document.getElementById('partDesc').value = part.description || "";
            document.getElementById('partPrice').value = part.price;
            document.getElementById('partStock').value = part.stock_quantity;
            document.getElementById('partSupplierId').value = part.supplier_id;

            // Sistemi "Güncelleme" moduna geçir
            editingPartId = id;
            document.getElementById('partFormTitle').innerText = `Parça Güncelle (#${id})`;
            document.getElementById('partSubmitBtn').innerText = "Değişiklikleri Güncelle";
            document.getElementById('partCancelBtn').style.display = "block"; // İptal butonunu göster
        }

        // --- YENİ EKLENEN: Düzenleme Modundan Çıkma ---
        function cancelPartEdit() {
            editingPartId = null;
            document.querySelector('#page-parts form').reset();
            document.getElementById('partFormTitle').innerText = "Yeni Parça Ekle";
            document.getElementById('partSubmitBtn').innerText = "Kaydet";
            document.getElementById('partCancelBtn').style.display = "none";
        }

        // --- GÜNCELLENEN: Ekleme ve Güncelleme İşlemini Yapan Tek Fonksiyon ---
        async function savePart() {
            // Formdaki verileri topla
            const payload = {
                name: document.getElementById('partName').value,
                description: document.getElementById('partDesc').value,
                price: parseFloat(document.getElementById('partPrice').value),
                stock_quantity: parseInt(document.getElementById('partStock').value),
                supplier_id: parseInt(document.getElementById('partSupplierId').value)
            };

            let url = `${API_URL}/parts/`;
            let methodType = 'POST'; // Varsayılan: Yeni ekleme (POST)

            // Eğer editingPartId doluysa, demek ki güncelleme (PATCH) yapıyoruz!
            if (editingPartId !== null) {
                url = `${API_URL}/parts/${editingPartId}`;
                methodType = 'PATCH';
            }

            const res = await fetch(url, {
                method: methodType, 
                headers: {'Content-Type': 'application/json'}, 
                body: JSON.stringify(payload)
            });

            if(res.ok) { 
                cancelPartEdit(); // İşlem başarılıysa formu sıfırla ve ekleme moduna dön
                loadParts(); 
                loadDashboardStats(); 
            } else { 
                const err = await res.json(); 
                alert("Hata: " + JSON.stringify(err.detail)); 
            }
        }

        async function deletePart(id) {
            if(!confirm('Bu parçayı silmek istediğinize emin misiniz?')) return;
            const res = await fetch(`${API_URL}/parts/${id}`, { method: 'DELETE' });
            if(res.ok) { loadParts(); loadDashboardStats(); }
            else { alert('Hata: Bu parçanın stok hareketi olabilir. Önce hareketleri silin.'); }
        }

        
        // ==========================================
        // 3. STOK HAREKETLERİ (MOVEMENTS) CRUD VE SAYFALAMA
        // ==========================================
        
        let allMovements = []; // Tüm veriyi hafızada tutacağız
        let filteredMovements = []; // Arama sonuçlarını tutacağız
        let currentMovementPage = 1; // Bulunduğumuz sayfa
        const itemsPerPage = 50; // Her sayfada 50 kayıt göster

        async function loadMovements() {
            // API'den tek seferde 5000 kaydı çekip JavaScript'in hafızasına alıyoruz
            const res = await fetch(`${API_URL}/movements/?limit=5000`);
            const data = await res.json();
            
            allMovements = data.reverse(); // En yeniler en üstte olsun
            filteredMovements = [...allMovements]; // Başlangıçta hepsi filtrelenmiş sayılır
            currentMovementPage = 1;
            
            renderMovementsTable();
        }

        // --- YENİ EKLENEN: Tabloyu Çizdirme ve Sayfalama ---
        function renderMovementsTable() {
            const tbody = document.getElementById('movementsTableBody');
            tbody.innerHTML = '';
            
            // Toplam sayfa sayısını hesapla
            const totalPages = Math.ceil(filteredMovements.length / itemsPerPage) || 1;
            document.getElementById('movementPageInfo').innerText = `Sayfa ${currentMovementPage} / ${totalPages} (Toplam ${filteredMovements.length} Kayıt)`;

            // Sadece o anki sayfanın dilimini (slice) al
            const startIndex = (currentMovementPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const paginatedItems = filteredMovements.slice(startIndex, endIndex);

            // Sadece alınan dilimi ekrana bas
            paginatedItems.forEach(m => {
                const typeColor = m.movement_type === 'IN' ? 'color: #10b981;' : 'color: #ef4444;';
                const dateStr = new Date(m.movement_date).toLocaleString('tr-TR');
                tbody.innerHTML += `<tr>
                    <td>#${m.id}</td>
                    <td>Parça #${m.part_id}</td>
                    <td style="${typeColor} font-weight:bold;">${m.movement_type}</td>
                    <td>${m.quantity} Adet</td>
                    <td>${dateStr}</td>
                    <td><button class="btn-danger" onclick="deleteMovement(${m.id})">Sil</button></td>
                </tr>`;
            });
        }

        // --- YENİ EKLENEN: Arama Çubuğu Filtresi ---
       // --- GÜNCELLENEN: Tam Eşleşmeli (Exact Match) Arama Filtresi ---
        function filterMovements() {
            const text = document.getElementById('searchMovement').value.toLowerCase().trim();
            
            // Eğer arama kutusu boşsa tüm listeyi geri getir
            if (text === '') {
                filteredMovements = [...allMovements];
            } else {
                filteredMovements = allMovements.filter(m => {
                    // 1. SAYILAR İÇİN TAM EŞLEŞME (Exact Match)
                    // Eğer kullanıcı "3" yazdıysa sadece "3" olanları bulur, "13"ü es geçer.
                    
                    const matchPartExact = m.part_id.toString() === text;
                    
                    
                    // 2. METİN VE TARİH İÇİN KISMİ EŞLEŞME (Includes)
                    const matchType = m.movement_type.toLowerCase().includes(text);
                    const matchDate = text.length >= 3 
                        ? new Date(m.movement_date).toLocaleString('tr-TR').toLowerCase().includes(text) 
                        : false;

                    // Herhangi bir şarta uyuyorsa o satırı ekranda göster
                    return matchPartExact || matchType || matchDate;
                });
            }
            
            currentMovementPage = 1;
            renderMovementsTable();
        }

        // --- YENİ EKLENEN: İleri/Geri Butonları Mantığı ---
        function changeMovementPage(direction) {
            const totalPages = Math.ceil(filteredMovements.length / itemsPerPage);
            const newPage = currentMovementPage + direction;
            
            // Eğer yeni sayfa sınırların içindeyse sayfayı değiştir
            if (newPage >= 1 && newPage <= totalPages) {
                currentMovementPage = newPage;
                renderMovementsTable();
            }
        }

        async function addMovement() {
            const payload = {
                part_id: parseInt(document.getElementById('movPartId').value),
                movement_type: document.getElementById('movType').value,
                quantity: parseInt(document.getElementById('movQuantity').value),
                movement_date: document.getElementById('movDate').value
            };
            const res = await fetch(`${API_URL}/movements/`, {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)
            });
            if(res.ok) { 
                document.getElementById('movQuantity').value = ''; 
                loadMovements(); loadParts(); loadDashboardStats(); 
            }
            else { const err = await res.json(); alert(err.detail); }
        }

        async function deleteMovement(id) {
            if(!confirm('Bu hareketi silmek stoğu geriye alacaktır. Emin misiniz?')) return;
            const res = await fetch(`${API_URL}/movements/${id}`, { method: 'DELETE' });
            if(res.ok) { loadMovements(); loadParts(); loadDashboardStats(); }
            else { alert('Silinemedi.'); }
        }
    </script>
</body>
</html>
